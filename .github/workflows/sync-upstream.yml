name: Sync upstream and deploy Pages

on:
  schedule:
    # Daily at 04:20 Asia/Shanghai, sync upstream main branch.
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge from upstream while preserving local deployment workflow
        id: sync
        run: |
          git remote add upstream https://github.com/CookSleep/gpt_image_playground.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream main is already included."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE=$(git rev-parse HEAD)
          if ! git merge --no-commit --no-ff upstream/main; then
            echo "Merge reported conflicts; restoring the fork-specific deployment workflow."
          fi

          # Never let upstream replace this fork's Pages deployment workflow.
          git restore --source="$BEFORE" --staged --worktree -- .github/workflows/deploy.yml

          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ -n "$CONFLICTS" ]; then
            echo "::error::Unresolved merge conflicts remain:"
            echo "$CONFLICTS"
            git merge --abort
            exit 1
          fi

          git commit --no-edit
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4